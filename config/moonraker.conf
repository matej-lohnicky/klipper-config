[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/run/klipper.sock

[authorization]
cors_domains:
    http://rpi:8090
trusted_clients:
    127.0.0.0/8
    ::1/128
    172.16.0.0/12
    100.64.0.0/10

[octoprint_compat]

[history]

[power webcam]
type: http
on_url: http://mainsail:8081/docker/start
off_url: http://mainsail:8081/docker/stop
status_url: http://mainsail:8081/docker/json
response_template:
  {% if command == "status" %}
    {% set resp = http_request.last_response().json() %}
    {"on" if resp["State"]["Running"] else "off"}
  {% else %}
    {command}
  {% endif %}
initial_state: off
off_when_shutdown: True
restart_klipper_when_powered: False
