# Map failed auth (401) to rate limit zone; 200/304 are empty and pass unrestricted
map $status $bruteforce_limit {
    ~^[4]   $binary_remote_addr;
    default "";
}

limit_req_zone $bruteforce_limit zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 150M;

    auth_basic "Klipper Protected";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Static Mainsail files
    location / {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Moonraker WebSocket
    location /websocket {
        proxy_pass http://moonraker:7125/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Moonraker REST API and gcode upload
    location ~ ^/(printer|api|access|server|machine)/ {
        proxy_pass http://moonraker:7125;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
