# Rate limit zone: keyed by client IP, 30 requests/second on average.
# Must live at the top level (http context), not inside a server block.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_status 429;

# Main server: the only one published to the host (port 8090), everything is behind basic auth
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Names are resolved at request time (via variables below),
    # so nginx keeps working when a container is recreated and gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Large enough for G-code uploads
    client_max_body_size 150M;

    auth_basic "Klipper Protected";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Generous limit: Mainsail fires dozens of requests on page load.
    # Protects against flooding only, not against password guessing.
    limit_req zone=general burst=60 nodelay;

    set $moonraker http://moonraker:7125;
    set $webcam_stream http://webcam:8080;

    # Static Mainsail files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Moonraker WebSocket
    location /websocket {
        proxy_pass $moonraker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Moonraker REST API and G-code upload
    location ~ ^/(printer|api|access|server|machine)/ {
        proxy_pass $moonraker;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }

    # Webcam MJPEG stream (uStreamer)
    location /webcam/ {
        # Variable in proxy_pass disables automatic prefix replacement,
        # so strip the /webcam/ prefix manually
        rewrite ^/webcam/(.*)$ /$1 break;
        proxy_pass $webcam_stream;
        proxy_set_header Host $http_host;
        # Streaming: do not buffer, keep the connection open
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}

# Internal server used only by Moonraker to switch the webcam container on/off.
# Port 8081 is intentionally NOT published in docker-compose.yml, so it is
# reachable only from inside the Docker network (no auth, no rate limit needed).
# Requests go through dockerproxy instead of mounting docker.sock into nginx.
server {
    listen 8081;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dockerproxy http://dockerproxy:2375;

    # Container state (used by Moonraker as status_url)
    location = /docker/json {
        proxy_pass $dockerproxy/containers/klipper_webcam/json;
        proxy_set_header Host localhost;
    }

    # Start the webcam container (Docker API requires POST)
    location = /docker/start {
        proxy_method POST;
        proxy_pass $dockerproxy/containers/klipper_webcam/start;
        proxy_set_header Host localhost;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Stop the webcam container (Docker API requires POST)
    location = /docker/stop {
        proxy_method POST;
        proxy_pass $dockerproxy/containers/klipper_webcam/stop;
        proxy_set_header Host localhost;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
